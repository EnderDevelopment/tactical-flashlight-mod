plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

ext.archivesName = "tacticalflashlightmod-1.0.0.jar"

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.99.11+1.21.4'
}

loom {
    accessWidenerPath = 'src/main/resources/accessWidener.txt'
    refreshVersions = true
    refreshDeps = true
    ide {
        runDir = 'run'
    }
}
